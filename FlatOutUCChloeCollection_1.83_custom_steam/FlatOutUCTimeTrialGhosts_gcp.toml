# FlatOut UC Time Trial Ghosts by Chloe @gaycoderprincess
# enjoy, nya~ :3

[main]
load_mismatched_replays = false				# Loads replays with matching names even if they were actually created using different settings (e.g. nitro, upgrades, car, etc.)

[extras]
always_show_input_display = false			# Always show the replay input display, even when driving

# Input display position & color scheme
[input_display]
pos_x = 0.2
pos_y = 0.85
highlight_r = 255
highlight_g = 0
highlight_b = 255
background_r = 64
background_g = 0
background_b = 64